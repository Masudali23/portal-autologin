# portal-autologin configuration
# Install to ~/.config/portal-autologin.conf and: chmod 600 it (holds a password).
#
# NOTE: comments must be on their own line. Everything after "key =" is taken
# literally to the end of the line, so passwords may contain # ; = spaces etc.
# Wrap a value in quotes if it has meaningful leading/trailing spaces.

[portal]
url      = http://192.168.252.1:1000/
username =
password =

# Optional: set only if the login form lives on a different page than `url`.
# login_url = http://192.168.252.1:1000/login.xml

# Your portal stops answering once you are authenticated, so "no answer at all"
# is treated as "still logged in". Set to no if your gateway always answers.
unreachable_means_logged_in = yes

# Decide purely from the portal page and ignore the internet probes.
# Enable only if your network blocks the probe hosts even while online.
trust_portal_only = no

use_system_proxy = no
probe_timeout = 5


[selectors]
# Leave blank to auto-detect. Run `portal-autologin.py --inspect` to print the
# real field names, then pin them here so login can never pick the wrong box.
username =
password =
submit   =

# Optional text that only appears after a successful login (logged for info).
success_text =

# Buttons to click on "you are already logged in - continue?" style prompts.
confirm_words = continue,yes,ok,proceed,login anyway,override


[browser]
# chrome | chromium | firefox
engine = chrome
headless = yes

# Only needed when the browser or its driver is not on PATH.
# binary = /usr/bin/google-chrome
# driver = /usr/local/bin/chromedriver

# Set to yes only when running as root or inside a container.
no_sandbox = no

page_timeout = 30
after_submit_wait = 4
verify_timeout = 30
save_debug_on_failure = yes


[schedule]
# 600 seconds = 10 minutes. Used by --daemon; the systemd timer has its own.
interval_seconds = 600
jitter_seconds = 20

# After a failed login, wait this long before retrying, doubling each time up
# to backoff_max. Protects you from locking the account out on a bad password.
backoff_base_seconds = 600
backoff_max_seconds = 3600
notify_after_failures = 3


[logging]
# debug | info | warning | error
level = info
desktop_notify = yes
# file = ~/.local/state/portal-autologin/portal-autologin.log
